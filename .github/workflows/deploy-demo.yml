name: Deploy demo to cPanel
on:
  push:
    branches: [main]
    paths:
      - 'management/web/**'
      - 'deploy/demo/**'
      - '.github/workflows/deploy-demo.yml'
permissions:
  contents: read
concurrency:
  group: cpanel-demo-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: management/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: management/web
      - run: npm test && npm run build
        working-directory: management/web
      - run: python3 tests/demo_deployment.py
      - name: Package browser assets only
        run: python3 deploy/demo/package.py --dist management/web/dist --out demo-release.tar.gz --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-release-${{ github.sha }}
          path: demo-release.tar.gz
          if-no-files-found: error
          retention-days: 14
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: demo-release-${{ github.sha }}
      - name: Publish through the restricted demo SSH command
        env:
          DEMO_DEPLOY_SSH_KEY: ${{ secrets.DEMO_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keyfile="$RUNNER_TEMP/liquidnat-demo-key"
          trap 'rm -f "$keyfile"' EXIT
          test -n "$DEMO_DEPLOY_SSH_KEY"
          printf '%s\n' "$DEMO_DEPLOY_SSH_KEY" > "$keyfile"
          ssh -F /dev/null -i "$keyfile" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/demo/known_hosts \
            -o ConnectTimeout=20 liquidnat@master.mywebsitepanel.com \
            "deploy $GITHUB_SHA" < demo-release.tar.gz
      - name: Verify the live HTTPS release
        run: python3 deploy/demo/smoke.py --commit "$GITHUB_SHA" --archive demo-release.tar.gz
