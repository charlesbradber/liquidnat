name: Gateway engine foundations
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install recorded direct development dependencies
        run: |
          sudo apt-get update
          python3 - <<'PY'
          import json, subprocess
          lock = json.load(open('packaging/dev/toolchain-lock.json'))
          packages = [f'{name}={version}' for name, version in lock['packages'].items()]
          subprocess.run(['sudo', 'apt-get', 'install', '-y', *packages], check=True)
          PY
          python3 packaging/dev/check-toolchain.py
      - name: Verify original engine and independent oracle
        run: python3 tests/verify.py --out benchmarks/results/ci
      - name: Preserve raw evidence including failed steps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-engine-evidence
          path: benchmarks/results/ci
          if-no-files-found: warn
          retention-days: 14
